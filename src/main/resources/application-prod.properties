# Perfil de produção
# - NÃO recria schema: usa validate (mais conservador).
#   Para migrações controladas, configure Flyway/Liquibase separadamente.
# - SQL oculto por padrão.
# - Todas as credenciais DEVEM vir de variáveis de ambiente.

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Em prod, app deve falhar rápido se as credenciais não estiverem setadas.
# O Spring já exige que as chaves SPRING_DATASOURCE_URL/USERNAME/PASSWORD existam
# no application.properties raiz; aqui reforçamos:
logging.level.com.petproject.martins=INFO
logging.level.org.hibernate.SQL=WARN