# Perfil de desenvolvimento
# - Recria o schema a cada start (apaga e recria) — NÃO use em prod
# - Mostra SQL no console
# - Senhas ficam em application-dev.local.properties (gitignored) ou env vars

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Datasource default local — substitua via env vars se preferir
