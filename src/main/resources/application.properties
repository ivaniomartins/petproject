# Configuração base — perfis ficam em application-{dev,prod}.properties
spring.application.name=petproject

# Profile ativo: defina via env SPRING_PROFILES_ACTIVE (ex.: dev, prod). Default: dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Datasource — todas as credenciais devem vir de variáveis de ambiente.
# Exemplo local: set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver: configure SPRING_DATASOURCE_DRIVER (ex.: com.mysql.cj.jdbc.Driver).
# Default seguro para MySQL; troque em prod conforme o banco.
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# Habilita o handler de 404 para rotas inexistentes (NoHandlerFoundException).
# Necessário para o ResourceExceptionHandler.notFound funcionar.
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true